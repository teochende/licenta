spring.application.name=hrdatabase
spring.data.rest.basePath=/api
spring.datasource.url=jdbc:postgresql://localhost:5432/HR
spring.datasource.username=teo
spring.datasource.password=teo123

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — update: aliniază schema la entități fără a șterge datele la repornire
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# optional (dar util)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (HS256 — secret minim 32 caractere / 256 biți)
jwt.secret=ChangeMeToAVeryLongSecretKeyAtLeast32CharsLongForHS256!!
jwt.expiration-ms=86400000

# CORS — origini explicite (obligatoriu cu allowCredentials=true); ex.: http://localhost:3000
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Fișiere descriere cereri (pdf/docx) — subdirector cereri/
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
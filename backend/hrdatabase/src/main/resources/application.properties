spring.application.name=hrdatabase
# Evită suprapunerea cu controlerele proprii sub /api (ex. /api/posturi/...).
spring.data.rest.basePath=/api/data
spring.datasource.url=jdbc:postgresql://localhost:5432/HR
spring.datasource.username=teo
spring.datasource.password=teo123

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — update: aliniază schema la entități fără a șterge datele la repornire
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# optional (dar util)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (HS256 — secret minim 32 caractere / 256 biți)
jwt.secret=ChangeMeToAVeryLongSecretKeyAtLeast32CharsLongForHS256!!
jwt.expiration-ms=86400000

# CORS — origini explicite (obligatoriu cu allowCredentials=true); ex.: http://localhost:3000
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Fișiere upload (cereri/, posturi/, etc.).
# IMPORTANT: folosește o cale stabilă (nu relativă la "working directory"),
# altfel după restart din alt folder fișierele "par" lipsă.
app.upload.dir=${user.home}/.licenta_devm/uploads
# Opțional: directoare vechi unde s-au salvat fișiere în trecut (pentru migrare).
# Poți pune aici căi absolute separate prin virgulă. Exemplu Windows:
# app.upload.legacy-dirs=C:/work/licenta_devm/uploads,D:/git/licenta_devm/uploads
app.upload.legacy-dirs=uploads
# CV până la 10 MB + videoclip opțional până la 200 MB într-o singură cerere de aplicare
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=220MB

# Modul AI CV review (FastAPI: module_ai/modul_ai_cv_review) — POST /analyze
ai.cv.review.enabled=true
ai.cv.review.base-url=http://127.0.0.1:8000
ai.cv.review.connect-timeout=15s
ai.cv.review.read-timeout=2m